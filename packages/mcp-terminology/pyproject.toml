[project]
name = "mcp-terminology"
version = "0.1.0"
description = "Unified LOINC / SNOMED / RxNorm / ICD-10 MCP server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "fhir-mcp-suite contributors" }]
keywords = ["mcp", "terminology", "loinc", "snomed", "rxnorm", "icd", "healthcare"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "mcp[cli]>=1.6",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "fhir-mcp-shared",
]

[project.scripts]
mcp-terminology = "mcp_terminology.server:main"

[project.urls]
Homepage = "https://github.com/pcmedsinge/fhir-mcp-suite"
Repository = "https://github.com/pcmedsinge/fhir-mcp-suite"
"Bug Tracker" = "https://github.com/pcmedsinge/fhir-mcp-suite/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_terminology"]

[tool.uv.sources]
fhir-mcp-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
]
