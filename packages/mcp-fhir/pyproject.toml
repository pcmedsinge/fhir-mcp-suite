[project]
name = "mcp-fhir"
version = "1.1.1"
description = "FHIR R4 MCP server — read, search, validate resources + SMART-on-FHIR auth (Epic/Cerner sandbox)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Parag Medsinge", email = "pcmedsinge@gmail.com" }]
keywords = ["mcp", "fhir", "hl7", "healthcare", "ai", "llm", "clinical-ai", "us-core", "ips"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "mcp[cli]>=1.6",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "fhir-mcp-shared>=0.1.0",
]

[project.scripts]
mcp-fhir = "mcp_fhir.server:main"

[project.urls]
Homepage = "https://github.com/pcmedsinge/fhir-mcp-suite"
Repository = "https://github.com/pcmedsinge/fhir-mcp-suite"
"Bug Tracker" = "https://github.com/pcmedsinge/fhir-mcp-suite/issues"
Documentation = "https://pcmedsinge.github.io/fhir-mcp-suite/"
Changelog = "https://github.com/pcmedsinge/fhir-mcp-suite/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_fhir"]

[tool.uv.sources]
fhir-mcp-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
]
