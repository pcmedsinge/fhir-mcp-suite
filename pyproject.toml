# uv workspace root — NOT a publishable package itself.
# Run `uv sync` from here to install all members' dev deps.

[tool.uv.workspace]
members = ["packages/*", "shared"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM", "S"]
ignore = ["E501", "RUF001", "RUF002"]   # RUF001/002: en-dashes in medical dose strings are intentional

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]   # assert + mock credentials are fine in tests
"**/tests/*.py" = ["S101", "S105", "S106"]
"evals/**" = ["S101", "N806", "N814", "SIM102", "RUF034"]  # eval scripts are not prod code
"demo/**" = ["S101", "S106", "SIM117", "RUF005"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["packages/mcp-fhir/tests", "packages/mcp-terminology/tests", "packages/mcp-clinical-reasoner/tests", "shared/tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: requires external services (HAPI, FHIR server)",
    "eval: long-running golden-query eval suite",
    "smart_integration: requires SMART sandbox credentials in .env (SMART_ENABLED=true)",
]
