name: Release to PyPI

# Triggers on version tags scoped to individual packages:
#   mcp-fhir-v1.0.0
#   mcp-terminology-v1.0.0
#   mcp-clinical-reasoner-v1.0.0
#   fhir-mcp-shared-v0.1.0
on:
  push:
    tags:
      - "mcp-fhir-v*"
      - "mcp-terminology-v*"
      - "mcp-clinical-reasoner-v*"
      - "fhir-mcp-shared-v*"

permissions:
  contents: write   # to create GitHub release
  id-token: write   # for OIDC PyPI trusted publishing

jobs:
  determine-package:
    name: Determine package from tag
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          # e.g. mcp-fhir-v1.0.0 → package=mcp-fhir, version=1.0.0
          PACKAGE=$(echo "$TAG" | sed 's/-v[0-9].*//')
          VERSION=$(echo "$TAG" | sed 's/.*-v//')
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $PACKAGE version $VERSION"

  build-and-publish:
    name: Build & publish ${{ needs.determine-package.outputs.package }}
    runs-on: ubuntu-latest
    needs: determine-package
    environment: pypi   # requires a GitHub environment named 'pypi' with trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Verify version matches tag
        run: |
          PKG="${{ needs.determine-package.outputs.package }}"
          EXPECTED="${{ needs.determine-package.outputs.version }}"
          # fhir-mcp-shared lives in shared/, all others in packages/<pkg>/
          if [ "$PKG" = "fhir-mcp-shared" ]; then
            TOML="shared/pyproject.toml"
          else
            TOML="packages/$PKG/pyproject.toml"
          fi
          ACTUAL=$(grep '^version' "$TOML" | head -1 | grep -oP '"\K[^"]+' )
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Version mismatch: $TOML has $ACTUAL, tag expects $EXPECTED"
            exit 1
          fi

      - name: Install build deps
        run: uv pip install build hatchling

      - name: Build wheel + sdist
        run: |
          PKG="${{ needs.determine-package.outputs.package }}"
          if [ "$PKG" = "fhir-mcp-shared" ]; then
            cd shared
          else
            cd packages/$PKG
          fi
          python -m build --outdir dist/

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: >-
            ${{ needs.determine-package.outputs.package == 'fhir-mcp-shared'
              && 'shared/dist/'
              || format('packages/{0}/dist/', needs.determine-package.outputs.package) }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ needs.determine-package.outputs.package }} v${{ needs.determine-package.outputs.version }}"
          generate_release_notes: true
          files: >-
            ${{ needs.determine-package.outputs.package == 'fhir-mcp-shared'
              && 'shared/dist/*'
              || format('packages/{0}/dist/*', needs.determine-package.outputs.package) }}
