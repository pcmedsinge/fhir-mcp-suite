name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - name: Install workspace dev deps
        run: uv sync --all-packages
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - name: Install workspace dev deps
        run: uv sync --all-packages
      - name: mypy — shared
        run: uv run mypy shared/src
      - name: mypy — mcp-fhir
        run: uv run mypy packages/mcp-fhir/src
      - name: mypy — mcp-terminology
        run: uv run mypy packages/mcp-terminology/src
      - name: mypy — mcp-clinical-reasoner
        run: uv run mypy packages/mcp-clinical-reasoner/src

  test:
    name: Unit tests — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - shared
          - mcp-fhir
          - mcp-terminology
          - mcp-clinical-reasoner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --all-packages
      - name: Run unit tests (no integration)
        run: |
          PKG=${{ matrix.package }}
          TEST_DIR=""
          if [ "$PKG" = "shared" ]; then
            TEST_DIR="shared/tests"
          else
            TEST_DIR="packages/$PKG/tests"
          fi
          # Skip if no tests directory yet (stub packages)
          if [ -d "$TEST_DIR" ]; then
            uv run pytest "$TEST_DIR" -v --cov --cov-report=xml \
              -m "not integration and not eval"
          else
            echo "No tests directory for $PKG — skipping"
          fi

  build:
    name: Build wheel — ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        package:
          - mcp-fhir
          - mcp-terminology
          - mcp-clinical-reasoner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
      - name: Install build deps
        run: uv pip install build hatchling
      - name: Build wheel
        run: |
          cd packages/${{ matrix.package }}
          python -m build --wheel --outdir dist/
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.package }}
          path: packages/${{ matrix.package }}/dist/*.whl
          if-no-files-found: error
